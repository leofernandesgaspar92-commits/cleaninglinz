# ============================================================================
#  Leco – Production-Deployment mit Load-Balancing.
#  PostgreSQL + 3 Backend-Replicas hinter nginx (Reverse Proxy + LB) +
#  statisches Frontend. Migration einmalig über den `migrate`-Service.
#
#    # Frontend bauen (liefert dist/), dann:
#    docker compose -f deploy/docker-compose.yml up -d --build --scale backend=3
# ============================================================================
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leco
      POSTGRES_PASSWORD: leco
      POSTGRES_DB: leco
    volumes: [leco_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leco']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ../backend
    command: node src/lib/migrate.js --seed
    environment:
      DATABASE_URL: postgres://leco:leco@db:5432/leco
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgres://leco:leco@db:5432/leco
      JWT_SECRET: ${JWT_SECRET:-bitte-in-produktion-setzen}
      REDIS_URL: redis://redis:6379
    depends_on:
      db: { condition: service_healthy }
    # nginx verteilt die Last; hochskalieren mit --scale backend=N
    expose: ['4000']

  redis:
    image: redis:7-alpine
    expose: ['6379']

  nginx:
    image: nginx:1.27-alpine
    ports: ['80:80']
    volumes:
      - ./nginx-docker.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/var/www/leco:ro
    depends_on: [backend]

volumes:
  leco_pgdata:
