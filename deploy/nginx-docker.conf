# nginx-Konfiguration für das Docker-Compose-Deployment.
# Der Upstream zeigt auf den Service-Namen "backend"; Dockers internes DNS
# verteilt die Anfragen über alle Replicas (docker compose --scale backend=N).
worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/json application/javascript image/svg+xml;

  upstream leco_backend {
    server backend:4000;   # Docker-DNS -> alle Replicas (Round-Robin)
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    root /var/www/leco;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location /api/ {
      proxy_pass http://leco_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz { proxy_pass http://leco_backend/api/health; }
    location = /readyz  { proxy_pass http://leco_backend/api/ready; }
  }
}
