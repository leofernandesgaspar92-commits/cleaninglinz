# ============================================================================
#  Leco – nginx Reverse Proxy + Load Balancing (Production)
#  - verteilt /api auf mehrere Backend-Instanzen (horizontale Skalierung)
#  - liefert das gebaute Frontend statisch aus (SPA-Fallback)
#  - proxyt AGI-Team (/agi) und Metriken (/metrics)
#  - gzip, Asset-Caching, Sicherheits-Header, Rate-Limit (Defense in Depth)
#  Validieren:  nginx -t -c deploy/nginx.conf
# ============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  # Rate-Limit-Zone (zusätzlich zum App-seitigen Limit).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

  # Lastverteilung über mehrere Backend-Instanzen.
  upstream leco_backend {
    least_conn;
    server 127.0.0.1:4000 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:4001 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:4002 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }
  upstream leco_agi {
    server 127.0.0.1:4100;
    keepalive 8;
  }

  server {
    listen 80;
    server_name _;

    # Sicherheits-Header (ergänzend zur App).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Gebautes Frontend (dist) ausliefern, SPA-Fallback auf index.html.
    root /var/www/leco;         # hierhin: frontend/dist kopieren
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Statische Assets langlebig cachen (Hash im Dateinamen).
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # API mit Load-Balancing.
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://leco_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth strenger begrenzt (Brute-Force-Schutz).
    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://leco_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Prometheus-Metriken (in Produktion per IP-Allowlist absichern).
    location /metrics {
      # allow 10.0.0.0/8; deny all;
      proxy_pass http://leco_backend;
    }

    # AGI-Team-Dashboard.
    location /agi/ {
      rewrite ^/agi/(.*) /$1 break;
      proxy_pass http://leco_agi;
      proxy_set_header Host $host;
    }

    # Health/Readiness für den Load-Balancer.
    location = /healthz { proxy_pass http://leco_backend/api/health; }
    location = /readyz  { proxy_pass http://leco_backend/api/ready; }
  }

  # --- HTTPS-Vorlage (Zertifikat eintragen und aktivieren) ------------------
  # server {
  #   listen 443 ssl http2;
  #   server_name leco.example.at;
  #   ssl_certificate     /etc/letsencrypt/live/leco/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/leco/privkey.pem;
  #   # ... gleiche location-Blöcke wie oben ...
  # }
}
